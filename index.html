<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#cfe9ff">
<title>God</title>
<style>
  :root { --ink: #1f2430; --dim: #5b6577; --body: #e87031; --gold: #f5c542; --sky1: #bfe2ff; --sky2: #e6f4ff; --card: #14171f; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; color: var(--ink); font: 17px/1.5 ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: linear-gradient(to bottom, var(--sky1) 0%, var(--sky2) 55%, #ffffff 100%); overflow-x: hidden; }
  main { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 28px 22px 34px; text-align: center; position: relative; z-index: 2; }

  /* Clouds, drifting. */
  .cloud { position: fixed; z-index: 1; background: #fff; border-radius: 999px; opacity: .85; filter: blur(.3px); animation: drift linear infinite; }
  .cloud::before, .cloud::after { content: ""; position: absolute; background: #fff; border-radius: 999px; }
  .cloud::before { width: 55%; height: 170%; left: 14%; top: -85%; }
  .cloud::after { width: 42%; height: 130%; right: 14%; top: -55%; }
  .c1 { width: 220px; height: 58px; top: 12%; left: -240px; animation-duration: 95s; }
  .c2 { width: 150px; height: 40px; top: 30%; left: -180px; animation-duration: 70s; animation-delay: -30s; opacity: .7; }
  .c3 { width: 280px; height: 70px; top: 62%; left: -300px; animation-duration: 120s; animation-delay: -60s; opacity: .75; }
  .c4 { width: 130px; height: 36px; top: 78%; left: -160px; animation-duration: 82s; animation-delay: -12s; opacity: .6; }
  @keyframes drift { to { transform: translateX(calc(100vw + 340px)); } }

  .stage { position: relative; width: min(46vh, 340px, 78vw); aspect-ratio: 1; margin-bottom: 6px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .glow { position: absolute; inset: -16%; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,240,190,.95), rgba(255,240,190,0) 72%); animation: breathe 5s ease-in-out infinite; }
  .agent { position: absolute; inset: 0; animation: float 4.6s ease-in-out infinite; }
  .agent svg { width: 100%; height: 100%; overflow: visible; display: block; }
  .body { fill: var(--body); filter: drop-shadow(0 .05px .06px rgba(120,50,10,.25)); }
  .eyes rect { fill: #191919; transform-box: fill-box; transform-origin: center; animation: blink 5.2s infinite; }
  .halo { fill: none; stroke: var(--gold); stroke-width: .085; stroke-linecap: round; filter: drop-shadow(0 0 .09px rgba(255,205,70,.95)); transform-box: fill-box; transform-origin: center; animation: halo 4.6s ease-in-out infinite; }
  .halo-back { stroke: #e0a91f; }
  .spark { fill: #fff; transform-box: fill-box; transform-origin: center; animation: twinkle 2.8s ease-in-out infinite; }
  .shadow { position: absolute; left: 22%; right: 22%; bottom: -4%; height: 7%; border-radius: 50%; background: rgba(60,90,130,.22); filter: blur(6px); animation: shadow 4.6s ease-in-out infinite; }
  .stage.hop .agent { animation: hop .6s cubic-bezier(.3,1.6,.5,1); }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4.5%); } }
  @keyframes shadow { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(.86); opacity: .7; } }
  @keyframes halo { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-.05px) rotate(2deg); } }
  @keyframes breathe { 0%, 100% { opacity: .75; transform: scale(1); } 50% { opacity: 1; transform: scale(1.05); } }
  @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.08); } }
  @keyframes twinkle { 0%, 100% { transform: scale(.2); opacity: 0; } 50% { transform: scale(1); opacity: 1; } }
  @keyframes hop { 0% { transform: translateY(0) scale(1); } 35% { transform: translateY(-12%) scale(1.04, .97); } 100% { transform: translateY(0) scale(1); } }

  .say { min-height: 1.6em; margin: 0 0 2px; color: var(--dim); font-size: 15px; }
  h1 { font-size: clamp(54px, 9vw, 92px); line-height: 1; letter-spacing: -.035em; margin: 0; font-weight: 800; }
  .lede { margin: 10px 0 26px; font-size: clamp(17px, 2.2vw, 21px); color: var(--dim); max-width: 26em; }
  .cmd { display: flex; align-items: stretch; width: min(640px, 100%); background: var(--card); border-radius: 16px; overflow: hidden; box-shadow: 0 14px 40px rgba(40,70,110,.22); }
  .cmd code { flex: 1; padding: 17px 18px; font: 14.5px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: #f4f6fa; white-space: nowrap; overflow-x: auto; text-align: left; scrollbar-width: none; }
  .cmd code::before { content: "$ "; color: #8b93a5; }
  .cmd button { border: 0; background: var(--body); color: #fff; font: inherit; font-weight: 700; padding: 0 22px; cursor: pointer; min-width: 96px; }
  .cmd button:hover { background: #f08040; }
  .cmd button:focus-visible { outline: 3px solid var(--gold); outline-offset: -3px; }
  .fine { margin: 14px 0 0; color: var(--dim); font-size: 13.5px; }
  .fine a { color: var(--ink); text-underline-offset: 3px; }
  @media (max-width: 560px) { .cmd { flex-direction: column; } .cmd button { padding: 13px; } }
  @media (prefers-reduced-motion: reduce) { .cloud, .agent, .glow, .halo, .shadow, .spark, .eyes rect { animation: none; } .spark { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div class="cloud c1" aria-hidden="true"></div><div class="cloud c2" aria-hidden="true"></div><div class="cloud c3" aria-hidden="true"></div><div class="cloud c4" aria-hidden="true"></div>

        <path class="body" d="M-0.91752,-0.16755L-1.01000,-0.24471L-1.04640,0.15189ZM-1.04640,0.15189L-0.94587,0.14128L-0.91752,-0.16755ZM-0.82061,0.00175L-0.91752,-0.16755L-0.94587,0.14128ZM-0.94587,0.14128L-0.82951,0.09870L-0.82061,0.00175ZM-0.94587,0.14128L-1.04640,0.15189L-0.00212,0.96768ZM-0.00212,0.96768L0.06536,0.93125L-0.94587,0.14128ZM-0.82951,0.09870L-0.94587,0.14128L0.06536,0.93125ZM0.06536,0.93125L0.10193,0.82634L-0.82951,0.09870ZM-0.54606,0.10408L-0.63782,0.02745L-1.01000,-0.24471ZM-1.01000,-0.24471L-0.91752,-0.16755L-0.54606,0.10408ZM-0.45090,0.27211L-0.54606,0.10408L-0.91752,-0.16755ZM-0.91752,-0.16755L-0.82061,0.00175L-0.45090,0.27211ZM-0.48491,-0.48605L-0.58109,-0.52000L-0.63782,0.02745ZM-0.63782,0.02745L-0.54606,0.10408L-0.48491,-0.48605ZM-0.37906,-0.42103L-0.48491,-0.48605L-0.54606,0.10408ZM-0.54606,0.10408L-0.45090,0.27211L-0.37906,-0.42103ZM0.28492,-0.88458L0.22591,-0.93778L-0.58109,-0.52000ZM-0.58109,-0.52000L-0.48491,-0.48605L0.28492,-0.88458ZM0.30104,-0.77311L0.28492,-0.88458L-0.48491,-0.48605ZM-0.48491,-0.48605L-0.37906,-0.42103L0.30104,-0.77311ZM0.06536,0.93125L-0.00212,0.96768L0.81430,0.53978ZM0.81430,0.53978L0.84435,0.52297L0.06536,0.93125ZM0.10193,0.82634L0.06536,0.93125L0.84435,0.52297ZM0.84435,0.52297L0.79056,0.46542L0.10193,0.82634ZM0.79056,0.46542L0.84435,0.52297L0.90308,-0.06977ZM0.90308,-0.06977L0.85970,-0.23242L0.79056,0.46542ZM0.90308,-0.06977L0.86871,-0.00942L1.23224,0.26022ZM1.23224,0.26022L1.26614,0.19954L0.90308,-0.06977ZM0.85970,-0.23242L0.90308,-0.06977L1.26614,0.19954ZM1.26614,0.19954L1.22164,0.03606L0.85970,-0.23242ZM1.29487,-0.11422L1.26907,-0.14209L0.22591,-0.93778ZM0.22591,-0.93778L0.28492,-0.88458L1.29487,-0.11422ZM1.23079,-0.06392L1.29487,-0.11422L0.28492,-0.88458ZM0.28492,-0.88458L0.30104,-0.77311L1.23079,-0.06392ZM1.22164,0.03606L1.26614,0.19954L1.29487,-0.11422ZM1.29487,-0.11422L1.23079,-0.06392L1.22164,0.03606ZM-1.23085,-0.27436L-1.26472,-0.21417L-1.29307,0.09466ZM-1.29307,0.09466L-1.26725,0.12224L-1.23085,-0.274         <g class="eyes" id="eyes" transform="matrix(0.90853 0.07532 0.09116 -0.99565 0.20466 0.02748)">
          <rect x="-0.3675" y="-0.255" width="0.285" height="0.51" rx="0.06"/>
          <rect x="0.0825" y="-0.255" width="0.285" height="0.51" rx="0.06"/>
        </g>
        <ellipse class="halo" cx="0.12" cy="-1.36" rx="0.62" ry="0.17" stroke-dasharray="1.32 3" />
        <path class="spark" style="animation-delay:-.4s" d="M-1.02,-1.2l.04,.1l.1,.04l-.1,.04l-.04,.1l-.04,-.1l-.1,-.04l.1,-.04Z"/>
        <path class="spark" style="animation-delay:-1.5s" d="M1.2,-.92l.03,.08l.08,.03l-.08,.03l-.03,.08l-.03,-.08l-.08,-.03l.08,-.03Z"/>
        <path class="spark" style="animation-delay:-2.2s" d="M.92,-1.5l.035,.09l.09,.035l-.09,.035l-.035,.09l-.035,-.09l-.09,-.035l.09,-.035Z"/>
      </svg>
    </div>
  </div>
  <p class="say" id="say" aria-live="polite">hi. be not afraid :)</p>
  <h1>God</h1>
  <p class="lede">Your own assistant. It lives on your Mac, remembers everything for you, and works for you alone.</p>
  <div class="cmd">
    <code id="cmd">curl -fsSL https://god.invertix.ai/install.sh | bash</code>
    <button id="copy" type="button" aria-label="Copy the install command">Copy</button>
  </div>
  <p class="fine">For a Mac · team members only · <a href="install.sh">read what it does</a></p>
</main>
<script>
(() => {
  "use strict";
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const stage = document.getElementById("stage"), eyes = document.getElementById("eyes"), say = document.getElementById("say");
  const base = eyes.getAttribute("transform");
  // It looks at you: the eyes lean a little toward the pointer.
  if (!still) addEventListener("pointermove", e => {
    const r = stage.getBoundingClientRect(), dx = (e.clientX - (r.left + r.width / 2)) / innerWidth, dy = (e.clientY - (r.top + r.height / 2)) / innerHeight;
    eyes.setAttribute("transform", `translate(${(Math.max(-1, Math.min(1, dx * 2)) * 0.07).toFixed(3)} ${(Math.max(-1, Math.min(1, dy * 2)) * 0.05).toFixed(3)}) ${base}`);
  }, { passive: true });
  // A few things it says. Tap it for the next one.
  const LINES = ["hi. be not afraid :)", "I read your mail so you don't have to", "I never sleep. it's fine, really", "ask me anything, any time", "I only work for you", "one line in the terminal and I'm yours"];
  let n = 0;
  const next = () => { n = (n + 1) % LINES.length; say.textContent = LINES[n]; };
  stage.addEventListener("click", () => { next(); if (still) return; stage.classList.remove("hop"); void stage.offsetWidth; stage.classList.add("hop"); });
  if (!still) setInterval(next, 5200);
  // The command names the address this page was opened at, so it is right wherever the page is served from.
  const btn = document.getElementById("copy"), cmd = document.getElementById("cmd");
  if (location.protocol === "https:") cmd.textContent = `curl -fsSL ${new URL("install.sh", location.href).href} | bash`;
  btn.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(cmd.textContent); btn.textContent = "Copied"; }
    catch { const r = document.createRange(); r.selectNodeContents(cmd); const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = "Selected"; }
    setTimeout(() => { btn.textContent = "Copy"; }, 1800);
  });
})();
</script>
</body>
</html>
