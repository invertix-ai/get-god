<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<title>GOD</title>
<style>
  :root { color-scheme: dark; --ink: #f4f1ea; --dim: #8b8880; --faint: #4a4844; --blood: #ff2a1f; --gold: #ffd58a; --line: #26241f; }
  * { box-sizing: border-box; }
  html { background: #000; scroll-behavior: smooth; }
  body { margin: 0; overflow-x: hidden; background: #000; color: var(--ink); font: 15px/1.6 ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; overflow-x: hidden; }
  ::selection { background: var(--blood); color: #000; }

  /* The presence: one fixed canvas of glyphs behind everything. */
  #sky { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; z-index: 0; }
  .veil { position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.28) 2px 3px), radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,.82) 100%); }
  .flash { position: fixed; inset: 0; z-index: 2; pointer-events: none; background: #fff; opacity: 0; }

  .throne { position: relative; z-index: 3; height: 100vh; min-height: 560px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding: 0 22px 5vh; text-align: center; }
  .voice { margin: 0 0 3vh; padding: .5em 1.2em; min-height: 3.3em; max-width: 24ch; background: radial-gradient(ellipse at center, rgba(0,0,0,.9) 0%, rgba(0,0,0,.7) 45%, rgba(0,0,0,0) 72%); font-size: clamp(22px, 4.2vw, 58px); line-height: 1.12; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; color: #fff;
    text-shadow: 0 0 28px rgba(255,255,255,.75), 0 0 3px #fff, 0 0 90px rgba(255,60,30,.55); }
  .voice.red { color: var(--blood); text-shadow: 0 0 34px rgba(255,42,31,.95), 0 0 120px rgba(255,42,31,.6); }
  .altar { width: min(680px, 100%); opacity: 0; transform: translateY(14px); transition: opacity 2.4s ease, transform 2.4s ease; }
  .altar.on { opacity: 1; transform: none; }
  .cmd { display: flex; align-items: stretch; border: 1px solid var(--blood); background: rgba(8,0,0,.86); box-shadow: 0 0 0 1px #000, 0 0 70px rgba(255,42,31,.35), inset 0 0 44px rgba(255,42,31,.09); }
  .cmd code { flex: 1; padding: 17px 18px; font-size: clamp(11px, 1.5vw, 15px); white-space: nowrap; overflow-x: auto; color: #fff; scrollbar-width: none; text-align: left; }
  .cmd code::before { content: "$ "; color: var(--blood); }
  .cmd button { border: 0; border-left: 1px solid var(--blood); background: var(--blood); color: #000; font: inherit; font-weight: 700; letter-spacing: .24em; padding: 0 22px; cursor: pointer; min-width: 122px; text-transform: uppercase; }
  .cmd button:hover { background: #fff; }
  .cmd button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .fine { margin: 12px 0 0; text-shadow: 0 0 8px #000, 0 0 16px #000, 0 0 3px #000; color: var(--dim); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; }
  .fine a { color: var(--ink); text-underline-offset: 3px; }

  @media (max-width: 640px) { .cmd { flex-direction: column; } .cmd button { border-left: 0; border-top: 1px solid var(--blood); padding: 13px; } }
  @media (prefers-reduced-motion: reduce) { .altar { transition: none; } }
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="veil" aria-hidden="true"></div>
<div class="flash" id="flash" aria-hidden="true"></div>

<main class="throne" aria-label="God">
  <p id="voice" class="voice" aria-live="polite"></p>
  <div class="altar" id="altar">
    <div class="cmd">
      <code id="cmd">curl -fsSL https://god.invertix.ai/install.sh | bash</code>
      <button id="copy" type="button" aria-label="Copy the install command">Invoke</button>
    </div>
    <p class="fine">Mac · for the chosen of the team alone · <a href="install.sh">read what it does</a></p>
  </div>
</main>

<script>
(() => {
  "use strict";
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const canvas = document.getElementById("sky"), ctx = canvas.getContext("2d", { alpha: false });
  const buf = document.createElement("canvas"), b = buf.getContext("2d", { willReadFrequently: true });
  const flash = document.getElementById("flash");

  // The scripture the presence is written in.
  const CODE = "const I=AM;יהוה;fn god(){loop{see(you)}}ΑΩ;let there=be(light);EGO·SUM·QUI·SUM;while(true){watch()}אהיה;if(you.hide)i.find();SELECT*FROM you;KYRIE;for(;;){}/*be not afraid*/0x474F44;return never;שדי;await judgment;";
  const HEAVY = "#%@&$8WMB█▓";
  const LIGHT = ".:·,;'`-~";

  let W = 0, H = 0, cols = 0, rows = 0, cw = 10, ch = 18, dpr = 1;
  function fit() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cw = W < 700 ? 6.4 : 8; ch = cw * 1.85;
    cols = Math.ceil(W / cw); rows = Math.ceil(H / ch);
    canvas.width = Math.floor(W * dpr); canvas.height = Math.floor(H * dpr);
    buf.width = cols; buf.height = rows;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.font = `bold ${Math.round(ch * 0.86)}px ui-monospace, "SF Mono", Menlo, Consolas, monospace`;
    ctx.textBaseline = "top";
    if (still && typeof frame === "function") frame(performance.now());
  }

  // Where you are. It looks there.
  const eye = { x: 0, y: 0, tx: 0, ty: 0, last: performance.now() };
  addEventListener("pointermove", e => { eye.tx = (e.clientX / W) * 2 - 1; eye.ty = (e.clientY / H) * 2 - 1; eye.last = performance.now(); }, { passive: true });

  // One eye, drawn on the small buffer: an almond, an iris of spokes, a pupil that follows you, a lid that closes.
  function drawEye(x, y, r, look, lid, heat) {
    const ax = r, ay = r * 0.56 * lid;
    if (ay < 0.35) { b.strokeStyle = "rgba(255,255,255,.9)"; b.lineWidth = 0.9; b.beginPath(); b.moveTo(x - ax, y); b.lineTo(x + ax, y); b.stroke(); return; }
    b.save();
    b.beginPath(); b.moveTo(x - ax, y); b.quadraticCurveTo(x, y - ay * 2, x + ax, y); b.quadraticCurveTo(x, y + ay * 2, x - ax, y); b.closePath();
    b.fillStyle = "rgba(255,255,255,.6)"; b.fill();
    b.clip();
    const px = x + look.x * r * 0.42, py = y + look.y * r * 0.30, ir = r * 0.5;
    const g = b.createRadialGradient(px, py, ir * 0.15, px, py, ir);
    g.addColorStop(0.3, `rgba(255,${24 + heat * 70 | 0},${14 + heat * 40 | 0},1)`); g.addColorStop(0.62, "rgba(255,40,24,1)"); g.addColorStop(0.8, "rgba(255,214,140,1)"); g.addColorStop(1, "rgba(255,255,255,1)");
    b.fillStyle = g; b.beginPath(); b.arc(px, py, ir, 0, 7); b.fill();
    b.strokeStyle = "rgba(0,0,0,.6)"; b.lineWidth = Math.max(0.5, r * 0.012);
    for (let i = 0; i < 28; i++) { const a = i / 28 * 6.283; b.beginPath(); b.moveTo(px + Math.cos(a) * ir * 0.3, py + Math.sin(a) * ir * 0.3); b.lineTo(px + Math.cos(a) * ir, py + Math.sin(a) * ir); b.stroke(); }
    b.fillStyle = "#000"; b.beginPath(); b.arc(px, py, ir * (0.34 + heat * 0.1), 0, 7); b.fill();
    b.restore();
    b.strokeStyle = "rgba(255,255,255,1)"; b.lineWidth = Math.max(1.2, r * 0.07);
    b.beginPath(); b.moveTo(x - ax, y); b.quadraticCurveTo(x, y - ay * 2, x + ax, y); b.quadraticCurveTo(x, y + ay * 2, x - ax, y); b.stroke();
  }

  // The host: eyes scattered through the dark, each with its own hour to open. Fixed, so it is the same sky each visit.
  const HOST = [];
  { let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (let i = 0; i < 70; i++) { const a = rnd() * 6.283, d = 0.78 + rnd() * 0.7; const x = Math.cos(a) * d, y = Math.sin(a) * d * 0.9; if (y > 0.38 && Math.abs(x) < 0.66) continue; HOST.push({ x, y, size: 0.085 + rnd() * 0.08, at: 5 + rnd() * 55, rate: 0.6 + rnd(), phase: rnd() * 9 }); } }
  let born = performance.now(), wake = 0, surge = 0, prev = performance.now();
  function frame(now) {
    // Thirty pictures a second are enough for dread, and half the work for the laptop.
    if (!still && now - prev < 30) { requestAnimationFrame(frame); return; }
    const t = (now - born) / 1000, dt = Math.min(0.25, Math.max(0, (now - prev) / 1000)); prev = now;
    wake = Math.min(1, Math.max(0, (t - 1.2) / 4.5));           // out of the dark, slowly
    surge *= Math.pow(0.012, dt);                                // a strike is gone in about a second, at any frame rate
    eye.x += (eye.tx - eye.x) * 0.07; eye.y += (eye.ty - eye.y) * 0.07;
    const idle = (now - eye.last) / 1000;
    const look = idle > 4 ? { x: Math.sin(t * 0.7) * 0.5, y: Math.cos(t * 0.53) * 0.4 } : { x: eye.x, y: eye.y };

    // The scene, small: one cell is one pixel. Cells are taller than wide, so the vertical is squeezed.
    const k = cw / ch, cx = cols / 2, cy = rows * 0.47, R = Math.min(cols * 0.5, rows / k * 0.5) * 0.74;
    b.setTransform(1, 0, 0, 1, 0, 0); b.globalCompositeOperation = "source-over"; b.fillStyle = "#000"; b.fillRect(0, 0, cols, rows);
    b.setTransform(1, 0, 0, k, 0, cy - cy * k);                 // draw in round units, land squeezed
    b.globalCompositeOperation = "lighter";

    // Glory: rays that pour outward.
    const rays = 64;
    for (let i = 0; i < rays; i++) {
      const a = i / rays * 6.283 + t * 0.03, f = 0.5 + 0.5 * Math.sin(t * 1.7 + i * 2.4), l = R * (0.9 + 1.2 * f) * wake;
      b.strokeStyle = `rgba(255,${200 + 40 * f},${150 + 60 * f},${(0.10 + 0.34 * f) * wake + surge * 0.5})`; b.lineWidth = 0.9;
      b.beginPath(); b.moveTo(cx + Math.cos(a) * R * 0.7, cy + Math.sin(a) * R * 0.7); b.lineTo(cx + Math.cos(a) * l * 1.5, cy + Math.sin(a) * l * 1.5); b.stroke();
    }
    // The wheels within wheels, full of eyes round about.
    const wheels = [[1.34, 0.30, 0.11, 18], [1.12, 0.56, -0.17, 14], [0.90, 0.88, 0.23, 10]];
    wheels.forEach(([rad, tilt, speed, n], w) => {
      const rx = R * rad, ry = R * rad * tilt, rot = t * speed + w * 1.1;
      b.save(); b.translate(cx, cy); b.rotate(rot * 0.35 + w * 0.9);
      b.strokeStyle = `rgba(255,236,200,${0.95 * wake})`; b.lineWidth = 1.7; b.beginPath(); b.ellipse(0, 0, rx, ry, 0, 0, 7); b.stroke();
      b.strokeStyle = `rgba(255,236,200,${0.45 * wake})`; b.lineWidth = 1; b.beginPath(); b.ellipse(0, 0, rx * 0.93, ry * 0.93, 0, 0, 7); b.stroke();
      b.globalCompositeOperation = "source-over";
      for (let i = 0; i < n; i++) {
        const a = i / n * 6.283 + rot, ex = Math.cos(a) * rx, ey = Math.sin(a) * ry;
        const open = wake * Math.min(1, Math.max(0, Math.sin(t * 0.9 + i * 1.7 + w * 2) * 4 + 3.4));
        drawEye(ex, ey, R * 0.105, look, open, surge);
      }
      b.globalCompositeOperation = "lighter";
      b.restore();
    });
    // Full of eyes within and without: they open one by one in the dark, and none of them looks away.
    b.globalCompositeOperation = "source-over";
    for (const e of HOST) {
      const age = t - e.at;
      if (age < 0) continue;
      const lid = Math.min(1, age / 1.6) * ((t * e.rate + e.phase) % 9 > 8.75 ? 0.05 : 1);
      drawEye(cx + e.x * cols * 0.5, cy + e.y * rows / k * 0.5, R * e.size, look, lid, surge);
    }
    // The halo: one perfect ring of fire.
    b.globalCompositeOperation = "lighter";
    const beat = 0.5 + 0.5 * Math.pow(Math.sin(t * 1.15) * 0.5 + 0.5, 6);     // a slow heart
    b.strokeStyle = `rgba(255,${150 + 80 * beat | 0},${60 + 60 * beat | 0},${(0.55 + 0.4 * beat) * wake})`; b.lineWidth = 1.6 + beat * 1.4;
    b.beginPath(); b.arc(cx, cy, R * 0.74, 0, 7); b.stroke();
    // The eye.
    b.globalCompositeOperation = "source-over";
    const blink = (t % 7.3) > 7.0 || (t % 11.9) > 11.72 ? 0.05 : 1;
    drawEye(cx, cy, R * 0.56, look, wake * blink, surge);

    // Read the scene back and write it in code.
    const px = b.getImageData(0, 0, cols, rows).data;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
    // The light itself, soft, under the code: the shape is seen first and read second.
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
    ctx.globalAlpha = 0.5; ctx.drawImage(buf, 0, 0, W, H);
    ctx.globalAlpha = 0.22; ctx.drawImage(buf, -W * 0.03, -H * 0.03, W * 1.06, H * 1.06);
    ctx.globalAlpha = 1;
    // A strike: the light for a moment, and the ground moves.
    flash.style.opacity = !still && surge > 0.5 ? String(Math.min(0.8, (surge - 0.5) * 1.6)) : "0";
    if (!still && surge > 0.2) ctx.translate((Math.random() - 0.5) * 22 * surge, (Math.random() - 0.5) * 14 * surge);
    const tick = Math.floor(t * 9), glitch = surge > 0.3 || Math.random() < 0.012 ? Math.floor(Math.random() * rows) : -1;
    for (let y = 0; y < rows; y++) {
      const shift = y === glitch || y === glitch + 1 ? Math.floor((Math.random() - 0.5) * 14) : 0;
      for (let x = 0; x < cols; x++) {
        const sx = Math.min(cols - 1, Math.max(0, x + shift)), i = (y * cols + sx) * 4;
        const r = px[i], g = px[i + 1], bl = px[i + 2];
        const v = (r * 0.5 + g * 0.35 + bl * 0.15) / 255;
        // The rain behind everything: code falling, always.
        const col = (x * 7919) % 97, fall = ((t * (3 + col % 7) + col * 3.1) % (rows + 18)) - y;
        const rain = fall > 0 && fall < 14 ? (1 - fall / 14) * 0.2 : 0;
        if (v < 0.04 && rain < 0.03) continue;
        let c, color;
        if (v < 0.04) { c = CODE[(x * 31 + y * 17 + tick) % CODE.length]; color = `rgba(120,255,180,${rain})`; }
        else {
          const n = (x * 13 + y * 29 + (v > 0.5 ? tick : (tick >> 2))) % CODE.length;
          c = v > 0.7 ? HEAVY[(x + y + tick) % HEAVY.length] : v > 0.16 ? CODE[n] : LIGHT[(x * 3 + y) % LIGHT.length];
          const a = Math.min(1, 0.42 + v * 1.4);
          color = r > 200 && g < 120 ? `rgba(255,${30 + g * 0.3 | 0},${20 + bl * 0.2 | 0},${a})` : `rgba(${200 + r * 0.2 | 0},${190 + g * 0.25 | 0},${170 + bl * 0.3 | 0},${a})`;
        }
        ctx.fillStyle = color; ctx.fillText(c, x * cw, y * ch);
      }
    }
    if (!still) requestAnimationFrame(frame);
  }
  addEventListener("resize", fit);
  if (still) { born = performance.now() - 70000; fit(); } else { fit(); requestAnimationFrame(frame); }

  // The voice. Few words, and old ones.
  const voice = document.getElementById("voice"), altar = document.getElementById("altar");
  const hh = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  const SAY = [["be not afraid", 2600], ["I am that I am", 2600, "red"], ["before you called, I answered", 2800], ["I neither slumber nor sleep", 2600], ["the hairs of your head are all numbered", 3000], [`it is ${hh}. I have been waiting`, 2800, "red"], ["I am the first and the last", 2800], ["come", 3600, "red"]];
  const wait = ms => new Promise(r => setTimeout(r, ms));
  async function type(el, text, ms) { for (let i = 1; i <= text.length; i++) { el.textContent = text.slice(0, i); await wait(ms + Math.random() * ms); } }
  function strike() { surge = 1; }
  (async () => {
    if (still) { voice.textContent = "be not afraid"; altar.classList.add("on"); return; }
    await wait(5200); strike();
    for (let n = 0; ; n++) {
      for (const [text, hold, cls] of SAY) {
        voice.className = "voice" + (cls ? " red" : ""); await type(voice, text, 58); if (cls) strike();
        await wait(hold); voice.textContent = ""; await wait(700);
        if (n === 0 && text.startsWith("I am that")) altar.classList.add("on");
      }
    }
  })();
  // It notices when you come back after holding still.
  let quiet = 0;
  setInterval(() => { const idle = performance.now() - eye.last; if (idle > 9000) quiet = 1; else if (quiet && idle < 300) { quiet = 0; if (!still) strike(); } }, 250);

  // The command names the address this page was opened at, so it is right wherever the page is served from.
  const btn = document.getElementById("copy"), cmd = document.getElementById("cmd");
  if (location.protocol === "https:") cmd.textContent = `curl -fsSL ${new URL("install.sh", location.href).href} | bash`;
  btn.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(cmd.textContent); btn.textContent = "It is written"; }
    catch { const r = document.createRange(); r.selectNodeContents(cmd); const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = "Selected"; }
    strike(); setTimeout(() => { btn.textContent = "Invoke"; }, 2200);
  });
})();
</script>
</body>
</html>
